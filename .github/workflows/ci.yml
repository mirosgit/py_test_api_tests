name: CI + Allure Pages

concurrency:
  group: pages
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE_URL: "https://reqres.in"
      API_X_API_KEY: "reqres-free-v1"
      API_TIMEOUT: "20"
      API_RETRIES: "2"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install "pydantic[email]>=2.8.2" pytest-xdist allure-pytest

      - name: Run tests (live + contract, parallel) -> allure-results + junit.xml
        run: |
          pytest -m "live or contract" -n auto --alluredir=allure-results --junitxml=junit.xml -vv -ra

      - name: Upload raw allure-results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Install Allure CLI
        run: |
          sudo npm i -g allure-commandline --no-audit --no-fund

      - name: Generate Allure HTML
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean
          test -f allure-report/index.html

      - name: Upload Pages artifact (Allure HTML)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: tests-and-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Post link to Job Summary
        run: |
          echo "### ✅ Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Open: **${{ steps.deployment.outputs.page_url }}**" >> $GITHUB_STEP_SUMMARY
