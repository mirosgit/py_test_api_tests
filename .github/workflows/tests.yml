name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      API_BASE_URL: "https://reqres.in"
      API_X_API_KEY: "reqres-free-v1"
      API_TIMEOUT: "20"
      API_RETRIES: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies (editable src-layout)
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install "pydantic[email]>=2.8.2" pytest-xdist allure-pytest

      - name: Show tree (debug imports)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          python -c "import sys, pprint; pprint.pp(sys.path[:5])"
          ls -la
          ls -la src || true
          ls -la tests || true

      - name: Run live & contract tests (parallel)
        run: |
          pytest -m "live or contract" -n auto --alluredir=allure-results --junitxml=junit.xml -vv -ra

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: junit.xml
          if-no-files-found: warn
          retention-days: 7
