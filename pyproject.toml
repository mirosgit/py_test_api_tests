[project]
name = "api-testing-reqres"
version = "0.1.0"
description = "API testing project template for ReqRes (PyTest + httpx + Pydantic + Allure)"
authors = [{name="Your Name"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.1",
    "allure-pytest>=2.13.5",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "tenacity>=9.0.0",
    "jsonschema>=4.23.0",
    "faker>=28.0.0",
    "python-json-logger>=2.0.7"
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
xfail_strict = true
markers = [
    "live: tests that hit the real ReqRes API",
    "contract: JSON schema contract checks"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
